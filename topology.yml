name: dien-tap-basic

hosts:
  - name: attacker
    base_box:
      image: Ubuntu20.04-cloud
      mgmt_user: ubuntu
    flavor: m1.small

  - name: victim
    base_box:
      image: Ubuntu20.04-cloud
      mgmt_user: ubuntu
    flavor: m1.small

routers:
  - name: router-main
    base_box:
      image: Ubuntu20.04-cloud
      mgmt_user: ubuntu
    flavor: m1.small

wan:
  name: wan
  cidr: 100.100.100.0/24

networks:
  - name: internal-net
    cidr: 192.168.10.0/24
    accessible_by_user: true

net_mappings:
  - host: attacker
    network: internal-net
    ip: 192.168.10.10

  - host: victim
    network: internal-net
    ip: 192.168.10.20

router_mappings:
  - router: router-main
    network: internal-net
    ip: 192.168.10.1

groups: []
